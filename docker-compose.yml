# Manager Library - infrastructure (T-20)
# ADR-001: this repo only creates the EMPTY engine, its user and its volume.
# The schema (tables, indexes, constraints, seed) belongs to the API migrations, run by the API at startup.
# The six repositories are cloned side by side; the api and app images are built from them.
services:
  db:
    image: postgres:16
    container_name: library-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - library-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../test-manager-library-3145556-api
    container_name: library-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_TIMEZONE: UTC
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SEARCH_PATH: library
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      COVERS_DIR: /var/covers
      CLOCK_OFFSET_DAYS: ${CLOCK_OFFSET_DAYS:-0}   # demo seeding only (T-21); keep 0
      PHP_CLI_SERVER_WORKERS: 4                     # parallel requests (RNF-2: simultaneous loans)
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - covers:/var/covers
    networks:
      - library-net

  app:
    build: ../test-manager-library-3145556-app
    container_name: library-app
    depends_on:
      - api
    ports:
      - "${APP_HOST_PORT:-5173}:5173"
    networks:
      - library-net

volumes:
  db-data:
  covers:

networks:
  library-net:
    name: library-net
