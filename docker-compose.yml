# Manager Library - infrastructure
# ADR-001: this file only creates the EMPTY engine, its user and its volume.
# The whole schema (tables, indexes, constraints, seed) belongs to the API migrations.
services:
  db:
    image: postgres:16
    container_name: library-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - library-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:

networks:
  library-net:
    name: library-net
